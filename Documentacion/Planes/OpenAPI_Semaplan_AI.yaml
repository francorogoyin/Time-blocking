openapi: 3.1.0
info:
  title: Semaplan AI Gateway
  version: 2.3.0
  description: API para leer Semaplan y ejecutar acciones B2 desde ChatGPT.
servers:
  - url: https://cprdnxkkhuuhdispubds.supabase.co/functions/v1/semaplan-ai
components:
  securitySchemes:
    SemaplanAIOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cprdnxkkhuuhdispubds.supabase.co/functions/v1/semaplan-ai/oauth/authorize
          tokenUrl: https://cprdnxkkhuuhdispubds.supabase.co/functions/v1/semaplan-ai/oauth/token
          scopes:
            read: Lectura de datos del usuario en Semaplan.
            write_tasks: Crear, marcar y reprogramar tareas.
            write_habits: Crear habitos y registrar cumplimiento.
            write_metas: Registrar avances de metas.
            write_archivero: Crear notas en el Archivero.
            write_baul: Crear items en el Baul.
  schemas:
    SemaplanRespuestaExitosa:
      type: object
      properties:
        Ok:
          type: boolean
          example: true
      required:
        - Ok
      additionalProperties: true
    SemaplanRespuestaError:
      type: object
      properties:
        Ok:
          type: boolean
          example: false
        Error:
          type: string
        Detalle:
          type: string
      required:
        - Ok
        - Error
        - Detalle
      additionalProperties: true
    SemaplanRespuestaBusqueda:
      type: object
      properties:
        Ok:
          type: boolean
          example: true
        Query:
          type: string
        Modulo:
          type: string
        Total:
          type: integer
          minimum: 0
        Offset:
          type: integer
          minimum: 0
        Limite:
          type: integer
          minimum: 1
        Hay_Mas:
          type: boolean
        Siguiente_Offset:
          type:
            - integer
            - 'null'
          minimum: 0
        Filtros:
          type: object
        Compacto:
          type: boolean
        Resultados:
          type: array
          items:
            type: object
      required:
        - Ok
        - Total
        - Offset
        - Limite
        - Hay_Mas
        - Siguiente_Offset
        - Resultados
      additionalProperties: true
paths:
  /salud:
    get:
      operationId: semaplan_salud
      summary: Chequear salud del gateway
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /openapi.json:
    get:
      operationId: semaplan_openapi
      summary: Obtener contrato OpenAPI del gateway
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /contexto:
    get:
      operationId: semaplan_contexto
      summary: Obtener contexto compacto de Semaplan
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /agenda:
    get:
      operationId: semaplan_agenda
      summary: Leer agenda, eventos y slots muertos por rango
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /tareas:
    get:
      operationId: semaplan_tareas
      summary: Leer tareas por rango y filtros
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: cajon
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /habitos:
    get:
      operationId: semaplan_habitos
      summary: Leer habitos visibles
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            format: date
        - name: modo
          in: query
          schema:
            type: string
            enum: [Dia, Semana, Quincena, Mes, Todos]
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /slots:
    get:
      operationId: semaplan_slots
      summary: Leer slots vacios o muertos por rango
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /planes/semana:
    get:
      operationId: semaplan_plan_semana
      summary: Leer snapshot y diff del plan semanal
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: semana
          in: query
          description: Fecha dentro de la semana deseada. El gateway la resuelve al lunes correspondiente.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /planes/periodos:
    get:
      operationId: semaplan_planes_periodos
      summary: Leer periodos o arbol compacto de un periodo
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: periodo_id
          in: query
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            type: string
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /archivero:
    get:
      operationId: semaplan_listar_archivero
      summary: Listar cajones y notas del Archivero
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: cajon_id
          in: query
          schema:
            type: string
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /archivero/buscar:
    get:
      operationId: semaplan_buscar_archivero
      summary: Buscar notas del Archivero por texto
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /baul:
    get:
      operationId: semaplan_listar_baul
      summary: Listar objetivos del Baul
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /metas:
    get:
      operationId: semaplan_listar_metas
      summary: Listar metas resumidas
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /buscar:
    get:
      operationId: semaplan_buscar_global
      summary: Buscar y paginar resultados de Semaplan y Decoteca
      description: >-
        Para Decoteca, usar modulo=decoteca y teca_id. La paginacion se aplica
        despues de los filtros y del orden estable Orden, Id. El parametro
        filtros usa sintaxis deepObject, por ejemplo
        filtros[descripcion_vacia]=true.
      security:
        - SemaplanAIOAuth:
            - read
      parameters:
        - name: q
          in: query
          description: Texto a buscar. Se puede omitir al listar Decoteca.
          schema:
            type: string
            maxLength: 200
        - name: modulo
          in: query
          schema:
            type: string
            enum: [todos, decoteca]
            default: todos
        - name: teca_id
          in: query
          description: Biblioteca, Musicoteca, Videoteca, Ludoteca o una teca personalizada.
          schema:
            type: string
        - name: limite
          in: query
          description: Cantidad maxima de resultados. Por defecto 30 y maximo 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Cantidad de resultados que se deben saltar. Por defecto 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: filtros
          in: query
          style: deepObject
          explode: true
          description: Filtros explicitos de Decoteca combinados con AND.
          schema:
            type: object
            properties:
              descripcion_vacia:
                type: boolean
              creador_vacio:
                type: boolean
              anio_vacio:
                type: boolean
              genero_vacio:
                type: boolean
              subgenero_vacio:
                type: boolean
              portada_vacia:
                type: boolean
              total_unidades_cero:
                type: boolean
              estado:
                type: string
              periodo:
                type: string
              prioridad:
                type: string
            additionalProperties: false
        - name: compacto
          in: query
          description: Omite registros, partes, metadatos e imagenes codificadas en Decoteca.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Respuesta paginada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaBusqueda"
        "400":
          description: Parametros invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaError"
  /b2/tareas/crear:
    post:
      operationId: semaplan_b2_crear_tarea
      summary: Crear una tarea en Semaplan
      security:
        - SemaplanAIOAuth:
            - read
            - write_tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                fecha:
                  type: string
                  format: date
                hora:
                  type: string
                  pattern: "^([01]?\\d|2[0-3]):[0-5]\\d$"
                cajon:
                  type: string
                prioridad:
                  type: string
                emoji:
                  type: string
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/tareas/marcar:
    post:
      operationId: semaplan_b2_marcar_tarea
      summary: Marcar una tarea como hecha o pendiente
      security:
        - SemaplanAIOAuth:
            - read
            - write_tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tarea_id:
                  type: string
                busqueda:
                  type: string
                nombre:
                  type: string
                hecha:
                  type: boolean
                  default: true
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/tareas/reprogramar:
    post:
      operationId: semaplan_b2_reprogramar_tarea
      summary: Cambiar fecha y hora de una tarea no vinculada
      security:
        - SemaplanAIOAuth:
            - read
            - write_tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tarea_id:
                  type: string
                busqueda:
                  type: string
                nombre:
                  type: string
                fecha:
                  type: string
                  format: date
                hora:
                  type: string
                  pattern: "^([01]?\\d|2[0-3]):[0-5]\\d$"
                sin_horario:
                  type: boolean
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/habitos/crear:
    post:
      operationId: semaplan_b2_crear_habito
      summary: Crear un habito simple
      security:
        - SemaplanAIOAuth:
            - read
            - write_habits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                tipo:
                  type: string
                  enum: [Hacer, Evitar]
                cantidad:
                  type: number
                unidad:
                  type: string
                emoji:
                  type: string
                color:
                  type: string
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/habitos/registrar:
    post:
      operationId: semaplan_b2_registrar_habito
      summary: Registrar cumplimiento de un habito
      security:
        - SemaplanAIOAuth:
            - read
            - write_habits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                habito_id:
                  type: string
                busqueda:
                  type: string
                nombre:
                  type: string
                fecha:
                  type: string
                  format: date
                cantidad:
                  type: number
                nota:
                  type: string
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/metas/avance:
    post:
      operationId: semaplan_b2_registrar_avance_meta
      summary: Registrar avance manual de una meta
      security:
        - SemaplanAIOAuth:
            - read
            - write_metas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [busqueda, cantidad]
              properties:
                busqueda:
                  type: string
                cantidad:
                  type: number
                unidad:
                  type: string
                fecha:
                  type: string
                  format: date
                hora:
                  type: string
                  pattern: "^([01]?\\d|2[0-3]):[0-5]\\d$"
                nota:
                  type: string
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/archivero/nota:
    post:
      operationId: semaplan_b2_crear_nota_archivero
      summary: Crear una nota en el Archivero
      security:
        - SemaplanAIOAuth:
            - read
            - write_archivero
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
                titulo:
                  type: string
                cajon_id:
                  type: string
                cajon:
                  type: string
                etiquetas:
                  type: array
                  items:
                    type: string
                origen:
                  type: string
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
  /b2/baul/item:
    post:
      operationId: semaplan_b2_crear_item_baul
      summary: Crear un item en el Baul
      security:
        - SemaplanAIOAuth:
            - read
            - write_baul
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                estado:
                  type: string
                  enum: [activo, pendiente, pausado]
                categoria_id:
                  type: string
                horas_aprox:
                  type: number
                timeline:
                  type: string
                  format: date
                emoji:
                  type: string
                color:
                  type: string
                idempotency_key:
                  type: string
              additionalProperties: true
      responses:
        "200":
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemaplanRespuestaExitosa"
